<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salma El Idrissi · Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --hero:#1b2cc4; --hero-deep:#0b1250; --page:#eef1fb; --card:#ffffff; --ink:#0d1240; --muted:#4d5593;
  --line:#cfd5f2; --chip:#dfe4fb; --mint:#5ff0c0; --warm:#ff7a2f; --on-hero:#f4f6ff;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--page:#0a0e30;--card:#121852;--ink:#eef0ff;--muted:#a9b2ee;--line:#27307a;--chip:#1c2570;--warm:#ff9a57}
}
:root[data-theme="dark"]{--page:#0a0e30;--card:#121852;--ink:#eef0ff;--muted:#a9b2ee;--line:#27307a;--chip:#1c2570;--warm:#ff9a57}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
a{color:inherit}
:focus-visible{outline:3px solid var(--warm);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding:0 24px}
.hero{position:relative;background:linear-gradient(165deg,var(--hero) 0%,var(--hero-deep) 100%);color:var(--on-hero);overflow:hidden;padding:72px 0 120px}
#mc{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .wrap{position:relative}
.rule{height:2px;max-width:620px;background:linear-gradient(90deg,var(--mint),transparent)}
.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--mint);margin:30px 0 22px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(46px,8vw,84px);line-height:1;letter-spacing:-.02em;margin:0 0 26px}
.lead{max-width:540px;font-size:18px;color:#d3d9ff;margin:0 0 30px}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
.pill{font-family:var(--mono);font-size:13px;font-weight:500;text-decoration:none;color:var(--on-hero);border:1.5px solid #7f8dff;padding:10px 20px;border-radius:999px;transition:background .2s,color .2s}
.pill:hover{background:var(--on-hero);color:var(--hero-deep)}
.bar{position:relative;z-index:2;margin-top:-34px}
.bar-in{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px;box-shadow:0 14px 34px -18px rgba(11,18,80,.5)}
.f{font-family:var(--mono);font-size:13px;background:transparent;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;transition:background .2s,color .2s}
.f:hover{background:var(--chip)}
.f[aria-pressed="true"]{background:var(--hero-deep);color:#fff;border-color:var(--hero-deep)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .f[aria-pressed="true"]{background:var(--mint);color:#06103a;border-color:var(--mint)}}
.cat-title{font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--warm);margin:54px 0 22px}
.row{display:grid;grid-template-columns:110px 1fr;gap:20px;padding:34px 0;border-top:1px solid var(--line)}
.row[hidden]{display:none}
.meta{font-family:var(--mono);font-size:13px;color:var(--warm);padding-top:6px}
.meta small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
h2{font-family:var(--serif);font-weight:700;font-size:clamp(21px,3vw,26px);line-height:1.25;letter-spacing:-.01em;margin:0 0 10px}
.row p{margin:0 0 16px;color:var(--muted);max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:0 0 18px}
.tags li{font-family:var(--mono);font-size:12px;background:var(--chip);color:var(--ink);padding:3px 10px;border-radius:4px}
.acts{display:flex;flex-wrap:wrap;gap:22px}
.acts a{text-decoration:none;font-weight:600;font-size:15px}
.acts a::before{content:"→ ";color:var(--warm);font-weight:400}
.acts a:hover{text-decoration:underline;text-underline-offset:4px}
footer{padding:36px 0 64px;color:var(--muted);font-size:15px;border-top:1px solid var(--line);margin-top:10px}
footer a{color:var(--ink)}
@media (max-width:640px){.row{grid-template-columns:1fr;gap:6px}.hero{padding-bottom:100px}}
@media (prefers-reduced-motion: reduce){.pill,.f{transition:none}}
</style>
</head>
<body>

<header class="hero">
  <canvas id="mc" aria-hidden="true"></canvas>
  <div class="wrap">
    <div class="rule"></div>
    <p class="eyebrow">PORTFOLIO · PROJETS ACADÉMIQUES</p>
    <h1 id="nom"></h1>
    <p class="lead" id="intro"></p>
    <div class="pills" id="pills"></div>
    <div class="rule"></div>
  </div>
</header>

<div class="wrap">
  <div class="bar"><div class="bar-in" id="filtres" role="group" aria-label="Filtrer les projets"></div></div>
  <p class="cat-title">CATALOGUE DES PROJETS</p>
  <div id="liste"></div>
  <footer id="pied"></footer>
</div>

<script>
/* =====================================================================
   ✏️  ZONE À MODIFIER : tout ce que vous devez changer est ICI.
   Ne touchez pas au reste du fichier.
   - Un lien vide ("") n'apparaît pas sur la page.
   - Pour ajouter un projet : copiez un bloc { ... }, collez-le à la suite
     (n'oubliez pas la virgule entre deux blocs) et changez les textes.
   - "categorie" crée automatiquement un bouton de filtre.
   ===================================================================== */
var PROFIL = {
  nom: "Salma El Idrissi",
  intro: "Élève ingénieure en Finance et Ingénierie Décisionnelle — projets réalisés dans le cadre de mes cours, chacun avec son code, son rapport et, quand c’est le cas, une application en ligne.",
  email: "",                                   // ex. "salma@exemple.com"
  github: "https://github.com/salma-elidrissi", // vérifiez votre pseudo
  linkedin: "",                                // ex. "https://www.linkedin.com/in/votre-profil"
  cv: ""                                       // ex. "cv-salma.pdf" (déposez le PDF dans le dépôt)
};

var PROJETS = [
  {
    code: "OPT",
    categorie: "Finance quantitative",
    titre: "Pricing d’options : rapport, interface et code",
    description: "Valorisation d’options et calcul de leurs sensibilités, avec un rapport détaillé et une interface interactive pour faire varier les paramètres.",
    outils: ["Python", "Black-Scholes", "Monte Carlo"],
    liens: [
      { texte: "Code", url: "" },
      { texte: "Rapport", url: "" },
      { texte: "Interface", url: "" }
    ]
  },
  {
    code: "TAUX",
    categorie: "Finance quantitative",
    titre: "Modélisation de l’impact des taux d’intérêt sur les décisions d’investissement au Maroc",
    description: "Étude de la façon dont l’évolution des taux d’intérêt influence les choix d’investissement au Maroc, avec modélisation et analyse des résultats.",
    outils: ["Modélisation", "Économétrie", "Séries temporelles"],
    liens: [
      { texte: "Code", url: "" },
      { texte: "Rapport", url: "" }
    ]
  },
  {
    code: "VOL",
    categorie: "Data science",
    titre: "Prédiction des prix des vols",
    description: "Modèle de machine learning qui estime le prix d’un billet d’avion à partir de ses caractéristiques, avec comparaison des modèles testés.",
    outils: ["Python", "Machine Learning", "Régression"],
    liens: [
      { texte: "Code", url: "" },
      { texte: "Rapport", url: "" }
    ]
  },
  {
    code: "SEG",
    categorie: "Data science",
    titre: "Classification et segmentation de données par CAH et K-means",
    description: "Regroupement de données en classes homogènes avec deux méthodes complémentaires, puis comparaison et interprétation des segments obtenus.",
    outils: ["Python", "CAH", "K-means"],
    liens: [
      { texte: "Code", url: "" },
      { texte: "Rapport", url: "" }
    ]
  }
];
/* ===================== FIN DE LA ZONE À MODIFIER ===================== */

(function(){
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
  function lien(txt,url,cls){var a=el('a',cls,txt);a.href=url;if(/^https?:/.test(url)){a.target='_blank';a.rel='noopener'}return a}

  document.title=PROFIL.nom+" · Portfolio";
  document.getElementById('nom').textContent=PROFIL.nom;
  document.getElementById('intro').textContent=PROFIL.intro;

  var pills=document.getElementById('pills');
  [["GitHub",PROFIL.github],["Email",PROFIL.email?"mailto:"+PROFIL.email:""],["LinkedIn",PROFIL.linkedin],["CV",PROFIL.cv]]
    .forEach(function(p){if(p[1])pills.appendChild(lien(p[0],p[1],'pill'))});

  var liste=document.getElementById('liste');
  PROJETS.forEach(function(p){
    var row=el('article','row');row.setAttribute('data-cat',p.categorie);
    var meta=el('div','meta',p.code);meta.appendChild(el('small','',p.categorie));
    var body=el('div');
    body.appendChild(el('h2','',p.titre));
    body.appendChild(el('p','',p.description));
    var ul=el('ul','tags');(p.outils||[]).forEach(function(o){ul.appendChild(el('li','',o))});body.appendChild(ul);
    var acts=el('div','acts');(p.liens||[]).forEach(function(l){if(l.url)acts.appendChild(lien(l.texte,l.url))});
    if(acts.children.length)body.appendChild(acts);
    row.appendChild(meta);row.appendChild(body);liste.appendChild(row);
  });

  var filtres=document.getElementById('filtres'),cats=[];
  PROJETS.forEach(function(p){if(cats.indexOf(p.categorie)<0)cats.push(p.categorie)});
  ['Tous'].concat(cats).forEach(function(c,i){
    var b=el('button','f',c);b.setAttribute('aria-pressed',i===0?'true':'false');
    b.addEventListener('click',function(){
      filtres.querySelectorAll('.f').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
      liste.querySelectorAll('.row').forEach(function(r){r.hidden=!(i===0||r.getAttribute('data-cat')===c)});
    });
    filtres.appendChild(b);
  });

  var pied=document.getElementById('pied');
  pied.appendChild(document.createTextNode(PROFIL.nom+" · Finance et Ingénierie Décisionnelle"));
  if(PROFIL.email){pied.appendChild(document.createTextNode(" · "));pied.appendChild(lien(PROFIL.email,"mailto:"+PROFIL.email))}
})();

/* Trajectoires de prix (Monte Carlo) dans le hero */
(function(){
  var cv=document.getElementById('mc'),ctx=cv.getContext('2d');
  var N=22,S=150,W,H,paths,t=0,hold=0,K=1.1;
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rn(){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)}
  function gen(){paths=[];var dt=1/S;for(var i=0;i<N;i++){var s=1,p=[1];for(var k=0;k<S;k++){s*=Math.exp(0.025*dt+0.3*Math.sqrt(dt)*rn());p.push(s)}paths.push(p)}t=0;hold=0}
  function size(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
  function draw(){
    ctx.clearRect(0,0,W,H);
    var x0=W>900?W*0.62:W*0.3,x1=W-12,Y=function(v){return H*0.5-Math.log(v)*H*0.9};
    ctx.setLineDash([6,6]);ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x0,Y(K));ctx.lineTo(x1,Y(K));ctx.stroke();ctx.setLineDash([]);
    var lim=Math.floor(t);
    paths.forEach(function(p){
      ctx.strokeStyle=p[S]>K?'rgba(95,240,192,.6)':'rgba(255,154,87,.45)';ctx.lineWidth=1.5;
      ctx.beginPath();
      for(var i=0;i<=lim;i++){var x=x0+(x1-x0)*i/S,y=Y(p[i]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
      ctx.stroke();
    });
  }
  function loop(){if(t<S){t+=1.4}else if(++hold>140){gen()}draw();requestAnimationFrame(loop)}
  size();gen();
  window.addEventListener('resize',function(){size();draw()});
  if(still){t=S;draw()}else{loop()}
})();
</script>
</body>
</html>
